name: Project template

on:
  pull_request:
    paths:
      - 'templates/**'
      - 'packaging/Xui.Templates.*'
      - 'packaging/TEMPLATES.md'
      - 'scripts/Pack-Templates.ps1'
      - 'scripts/Release.Common.ps1'
      - 'tests/templates.ps1'
      - '.github/workflows/templates.yml'
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - 'packaging/Xui.Templates.*'
      - 'packaging/TEMPLATES.md'
      - 'scripts/Pack-Templates.ps1'
      - 'scripts/Release.Common.ps1'
      - 'tests/templates.ps1'
      - '.github/workflows/templates.yml'

permissions:
  contents: read

jobs:
  template:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check template package and project generation
        shell: pwsh
        run: .\tests\templates.ps1

  <title id="title-107">One-bit king lion</title>
  <desc id="desc-107">A front-facing lion head. Only one ink color and paper-colored voids define this stepped head. Rectangular ear notches, pixel eyes, and a blocky divided muzzle share the same coarse grid.</desc>

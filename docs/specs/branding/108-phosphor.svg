  <title id="title-108">Phosphor lion</title>
  <desc id="desc-108">A front-facing lion head. Horizontal green scanlines form both mane and face. Dark eye wedges and a stepped muzzle interrupt the phosphor bars without adding a screen-shaped background.</desc>

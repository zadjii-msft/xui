<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title-116 desc-116">
  <title id="title-116">Saffron scallop lion</title>
  <desc id="desc-116">A front-facing lion head. Three warm scalloped layers build a broad retro mane. A square lower jaw, heavy eyelids, and soft muzzle pads give the head a relaxed expression.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title-120 desc-120">
  <title id="title-120">Auric rays lion</title>
  <desc id="desc-120">A front-facing lion head. Alternating warm and cool metal facets radiate from a broad sculpted face. Local gradients create reflective planes, with dark eyes and nose cut into the highlights.</desc>

  <title id="title-95">Cobalt clay lion</title>
  <desc id="desc-95">A front-facing lion head. Bulbous cobalt locks surround pale ceramic inlays. Soft cheek tiles, rounded ears, and a small split muzzle give the glaze pattern a clear lion structure.</desc>

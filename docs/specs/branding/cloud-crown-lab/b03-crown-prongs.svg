  <title id="title">Cloud Crown lab - Crown prongs</title>
  <desc id="desc">Long angular prongs turn the cloud into an improbable crown. Six touching Enamel-colored mane segments surround a front-facing Softling lion. The original facial features remain, with deliberate scale or tilt changes in some studies.</desc>

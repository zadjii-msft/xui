  <title id="title">Cloud Crown lab - Cut stone</title>
  <desc id="desc">A faceted crown with hard shoulders and no rounded cloud lobes. Six touching Enamel-colored mane segments surround a front-facing Softling lion. The original facial features remain, with deliberate scale or tilt changes in some studies.</desc>

  <title id="g03-title">G03 — Deco jewel</title>
  <desc id="g03-desc">A front-facing lion in stepped jewel settings. Six touching pastel panels have navy edges and gold inlay; a long gold face has narrow calm eyes and a pendant-shaped exposed chin.</desc>

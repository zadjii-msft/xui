  <title id="g04-title">G04 — Swiss pictogram</title>
  <desc id="g04-desc">A reduced front-facing lion pictogram with six unoutlined touching cloud sectors, a flat cream face, minute rectangular eyes, and a clear rounded chin below the mane.</desc>

  <title id="g10-title">G10 — Negative-space mark</title>
  <desc id="g10-desc">A front-facing lion symbol with six strong touching cloud-crown colors. Open channels carve the ears, eyes, heart-shaped nose, smile, and whiskers through a cream face. Its rounded chin extends below the mane.</desc>

  <title id="g11-title">G11 — Layered paper</title>
  <desc id="g11-desc">A front-facing lion made from overlapping cut-paper planes. Six joined rainbow sheets form the high cloud crown. Offset paper shadows, folded ears, stacked cheek pieces, and a cream muzzle make a dimensional face with an exposed chin.</desc>

  <title id="g13-title">G13 — Ceramic glaze</title>
  <desc id="g13-desc">A glazed ceramic lion with a continuous six-color cloud crown. Curved pools of glaze and small glossy reflections describe rounded clay. The face has recessed eyes, sculpted cheeks, and an ivory double muzzle above the bare chin.</desc>

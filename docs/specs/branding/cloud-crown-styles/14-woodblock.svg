  <title id="g14-title">G14 — Woodblock</title>
  <desc id="g14-desc">A six-ink woodblock lion. Flowing carved grain follows the touching cloud-crown panels. Chisel-cut eyes, a split angular muzzle, irregular ink contours, and long facial incisions create a woodcut face, not a smooth recoloring.</desc>

  <title id="g15-title">G15 — Linocut</title>
  <desc id="g15-desc">A bold linocut lion with six touching rainbow crown areas. Broad scoop-shaped cuts replace wood grain. Dark angular brows, alert almond eyes, a block-cut nose, and an asymmetric cream muzzle give the face a strong printed expression.</desc>

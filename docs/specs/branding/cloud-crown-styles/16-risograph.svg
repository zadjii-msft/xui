  <title id="g16-title">G16 — Risograph</title>
  <desc id="g16-desc">A six-color risograph lion with a joined cloud crown, translucent overprints, coarse ink dots, and small registration offsets. The face is assembled from offset apricot and ochre impressions, with a two-lobed cream muzzle and separately printed eyes.</desc>

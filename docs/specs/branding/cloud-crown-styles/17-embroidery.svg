  <title id="g17-title">G17 — Embroidery</title>
  <desc id="g17-desc">A densely embroidered lion. Six joined satin-stitch fields make the cloud crown. Directional thread strokes, twisted edge cords, embroidered eyelids, a woven nose, and radiating muzzle stitches build the face above an exposed chin.</desc>

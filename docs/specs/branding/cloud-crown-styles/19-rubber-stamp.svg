  <title id="g19-title">G19 — Rubber stamp</title>
  <desc id="g19-desc">A six-ink rubber-stamped lion with a touching rainbow cloud crown. Ragged dark ink edges, pale pinholes in the ink, and short distressed cuts suggest uneven pressure. A separately cut ochre face has broken ring ears, imperfect eye impressions, and a coarse cream muzzle.</desc>

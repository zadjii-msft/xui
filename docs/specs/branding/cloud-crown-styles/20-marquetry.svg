  <title id="g20-title">G20 — Marquetry</title>
  <desc id="g20-desc">A wood-inlay lion built from six touching dyed veneer crown panels. Fine directional grain and fitted dark joints suggest marquetry. The face combines pale maple, honey-colored cheek inlays, walnut eyes, and a two-piece muzzle above a separate chin veneer.</desc>

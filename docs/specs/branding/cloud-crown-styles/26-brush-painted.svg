  <title id="g26-title">G26 — Brush-painted</title>
  <desc id="g26-desc">A lion made from confident solid paint strokes. Six touching crown colors retain brush-shaped edges, while gestural eyes, a broad painted nose, and lively cream cheek strokes define the face.</desc>

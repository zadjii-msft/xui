  <title id="g28-title">G28 — Neon tube</title>
  <desc id="g28-desc">A daylight-readable neon lion on transparency. Six filled Enamel crown panels meet beneath dark seams and inset light tubes. Warm luminous facial lines sit on a charcoal lion head, with no background or glow filter.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Softling - Broad cloud - Enamel mane colors</title>
  <desc id="desc">The unchanged front-facing Softling face inside a six-color cloud mane. Wider shoulders and fuller side locks give the same face a broader cloud frame. The mane uses the six solid Enamel colors, without its outlines or highlights. All segments touch, without gaps or divider lines. The chin stays clear.</desc>

  <title id="title">Softling - Plush fan / Touching colors</title>
  <desc id="desc">The original front-facing Softling face and pastel rainbow palette, with a fuller plush fan mane. Continuous mane with no gaps or divider lines. Six colored segments surround the upper face. The chin stays clear.</desc>

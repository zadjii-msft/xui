  <title id="title">Softling - Round halo / Wavy joins</title>
  <desc id="desc">The original front-facing Softling face and pastel rainbow palette, with a fuller round halo mane. Continuous mane with flowing S-shaped color boundaries. Six colored segments surround the upper face. The chin stays clear.</desc>

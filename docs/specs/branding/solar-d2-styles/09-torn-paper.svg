  <title id="s09-title">S09 — Torn-paper lion</title>
  <desc id="s09-desc">A calm frontal lion assembled from torn ivory and ochre paper. Six ragged rainbow sheets fan above its angular face; rectangular eyes, a cut-paper nose and overlapping muzzle scraps leave the chin clear.</desc>

  <title id="s11-title">S11 — Carved wood lion</title>
  <desc id="s11-desc">An upright frontal lion with a long carved nose, squared ears and small watchful eyes. Six broad rainbow woodcut blocks carry pale gouge marks; the tan wood face ends below the mane in a rounded, bare chin.</desc>

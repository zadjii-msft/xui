  <title id="s12-title">S12 — Risograph lion</title>
  <desc id="s12-desc">A broad, pink, round-cheeked lion with small circular ears, dot eyes and a flat oval nose. Six overlapping rainbow ink fans use halftone grain and deliberately offset keylines; its pale muzzle and short chin sit below the mane.</desc>

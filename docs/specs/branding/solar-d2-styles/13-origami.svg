  <title id="s13-title">S13 — Origami lion</title>
  <desc id="s13-desc">A frontal lion folded from cool ivory paper with sharp ear pockets, diamond eyes and a projecting terracotta nose plane. Six rainbow accordion sheets rise behind its faceted forehead; the tapered chin remains below every mane fold.</desc>

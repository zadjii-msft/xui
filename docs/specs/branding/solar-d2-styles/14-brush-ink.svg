  <title id="s14-title">S14 — Brush-ink lion</title>
  <desc id="s14-desc">A frontal lion drawn with broken charcoal brush contours on a warm ivory face. Six loose rainbow paint strokes form an upward fan; spare watchful eyes, a long ink nose and open muzzle strokes replace the original face construction.</desc>

  <title id="s15-title">S15 — Glazed-clay lion</title>
  <desc id="s15-desc">A pale celadon ceramic lion with plump ear cups, inset round eyes, a raised nose bridge and two porcelain muzzle pads. Six softly glazed rainbow tiles form its upper fan, with no tile beneath the rounded chin.</desc>

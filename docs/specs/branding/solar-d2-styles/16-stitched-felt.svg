  <title id="s16-title">S16 — Stitched-felt lion</title>
  <desc id="s16-desc">A teal felt lion with stitched round ears, sewn button eyes and separate cream cheek patches. Six blanket-stitched rainbow fabric panels fan upward; a burgundy embroidered nose and small woven chin patch complete the frontal head.</desc>
